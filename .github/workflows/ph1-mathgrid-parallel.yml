name: PH1 MathGrid Parallel Replay
on:
  push:
    branches: [ph1-mathgrid-parallel]
  workflow_dispatch:

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        year: [2025, 2026]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          g++ -O3 -std=c++20 ph1_mathgrid/ph1_mathgrid.cpp -o ph1_mathgrid/ph1_mathgrid
          mkdir -p results merged
      - name: Selftest
        run: |
          ./ph1_mathgrid/ph1_mathgrid --selftest > merged/selftest.csv
          python3 - <<'PY'
          import csv
          r=list(csv.DictReader(open('merged/selftest.csv')))
          assert [round(float(x['net']),2) for x in r]==[0.93,1.72,1.72,1.51,1.51]
          print('SELFTEST_PASS')
          PY
      - name: Replay year
        shell: bash
        run: |
          set -euo pipefail
          Y='${{ matrix.year }}'
          if [ "$Y" = '2025' ]; then MONTHS='01 02 03 04 05 06 07 08 09 10 11 12'; else MONTHS='01 02 03 04 05 06 07 08 09 10'; fi
          for M in $MONTHS; do
            URL="https://ticks.ex2archive.com/ticks/XAUUSD_Raw_Spread/${Y}/${M}/Exness_XAUUSD_Raw_Spread_${Y}_${M}.zip"
            curl -L --fail --retry 5 --retry-delay 2 "$URL" -o "/tmp/x_${Y}_${M}.zip"
            unzip -p "/tmp/x_${Y}_${M}.zip" | ./ph1_mathgrid/ph1_mathgrid chartzero > "results/chartzero_${Y}_${M}.csv"
            unzip -p "/tmp/x_${Y}_${M}.zip" | ./ph1_mathgrid/ph1_mathgrid fillzero > "results/fillzero_${Y}_${M}.csv"
            rm -f "/tmp/x_${Y}_${M}.zip"
          done
      - name: Summaries
        run: |
          Y='${{ matrix.year }}'
          for MODE in chartzero fillzero; do python3 ph1_mathgrid/summarize.py "$MODE" "$Y" | tee "merged/${MODE}_${Y}_summary.txt"; done
      - uses: actions/upload-artifact@v4
        with:
          name: PH1-MathGrid-${{ matrix.year }}
          path: |
            merged/
            results/
          retention-days: 7
