name: Swing Exact Exness SL10-100 TP2x Hold Until Friday (No Time Exit)
on:
  push:
    branches: [xauusd-swing-rr12-sl10-to-sl100-20261107]
    paths:
      - 'swing_rr12/raw_tick_until_friday.py'
      - '.github/workflows/swing-rr12-friday-no-early-timeout.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - first: 2020
            last: 2024
            period: friday_train_2020_2024
          - first: 2025
            last: 2026
            period: friday_holdout_2025_2026
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'numba==0.61.2' 'requests==2.32.5'
      - name: Static script verification
        run: python -m py_compile swing_rr12/raw_tick_until_friday.py
      - name: Download original verified Exness H1 signal dataset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p local_data
          gh run download 42357164359 -n xauusd-2020-2026-h1-astro-source-bid-candles -D local_data --repo davidamerson/suresh
          test -s local_data/complete_monday_friday_h1_candles.csv
      - name: Reprocess every tick until 1to2 TP, SL or Friday 19:59 close
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/${{ matrix.period }}
          python -u swing_rr12/raw_tick_until_friday.py --h1 local_data/complete_monday_friday_h1_candles.csv --first ${{ matrix.first }} --last ${{ matrix.last }} --out results/${{ matrix.period }} 2>&1 | tee results/${{ matrix.period }}/run.log
      - name: Preserve all actual Bid Ask quotes execution results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swing-rr12-friday-exact-${{ matrix.period }}
          path: results/${{ matrix.period }}/
          retention-days: 30
          if-no-files-found: warn
