name: Inspect public official live pages for free stream source
on:
  push:
    branches: [srilanka-tv-verification-20261108]
    paths: [.github/workflows/tv-official-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Read only public broadcaster pages and test decoded video
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,base64,re,subprocess,html,datetime
          urls={'Swarnavahini':'https://sky.lk/','ITN':'https://itn.lk/live/','Vasantham TV':'https://www.vasantham.lk/','Sirasa TV':'https://live.sirasatv.lk/'}
          for name,url in urls.items():
            print('OFFICIAL_PAGE',name,url,flush=True)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125.0 Safari/537.36','Accept':'text/html'})
              with urllib.request.urlopen(req,timeout=22) as f:
                body=f.read(500000).decode('utf-8','replace')
                print('OFFICIAL_HTTP',name,f.status,'BYTES',len(body),flush=True)
              iframes=re.findall(r'<iframe[^>]+src=["\\x27]([^"\\x27]+)',body,re.I)
              print('OFFICIAL_IFRAMES',name,[i[:90] for i in iframes[:6]],flush=True)
              for u in iframes:
                if name=='Swarnavahini' and 'iframes.5centscdn.com/videojs/hls/' in u:
                  b64=u.split('/videojs/hls/',1)[1].split('/',1)[0]
                  original=base64.b64decode(b64+'='*((-len(b64))%4)).decode()
                  clean=original.split('?')[0]
                  print('PUBLICLY_EMBEDDED_VIDEO_PATH',name,clean,'HAS_EXPIRY',('expires=' in original),flush=True)
                  m=re.search(r'[?&]expires=(\d+)',original)
                  if m:print('EMBED_EXPIRES_UTC',datetime.datetime.fromtimestamp(int(m.group(1)),datetime.timezone.utc),flush=True)
                  for extra in ([],['-headers','Referer: https://sky.lk/\r\n']):
                    cmd=['ffmpeg','-hide_banner','-nostdin','-loglevel','error','-rw_timeout','10000000','-user_agent','Mozilla/5.0']+extra+['-i',original,'-map','0:v:0','-an','-frames:v','5','-f','null','-','-progress','pipe:1']
                    try:
                      result=subprocess.run(cmd,capture_output=True,text=True,timeout=28)
                      frames=max([int(x) for x in re.findall(r'^frame=(\d+)',result.stdout,re.M)] or [0])
                      print('OFFICIAL_SOURCE_TEST',name,'REFERRER',bool(extra),'FRAMES',frames,'EXIT',result.returncode,'ERROR',result.stderr.replace('\n',' | ')[:180],flush=True)
                      if frames>=5 and result.returncode==0:break
                    except subprocess.TimeoutExpired:print('OFFICIAL_SOURCE_TEST',name,'TIMEOUT',flush=True)
            except Exception as e:print('OFFICIAL_FETCH_ERROR',name,type(e).__name__,str(e)[:180],flush=True)
          PY