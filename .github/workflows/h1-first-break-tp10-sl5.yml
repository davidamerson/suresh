name: XAUUSD H1 First Break TP10 SL5 Real-Tick 2025-2026
on:
  push:
    branches: [h1-first-break-tp10-sl5]
    paths:
      - "ph1_backtest/h1_first_break_tp10_sl5.py"
      - ".github/workflows/h1-first-break-tp10-sl5.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    name: TP10 SL5 Real Ticks ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        year: [2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Numba, NumPy, Pandas and Requests
        run: pip install "numpy==2.2.6" "pandas==2.2.3" "numba==0.61.2" "requests==2.32.5" "tzdata==2026.6"
      - name: Verify Python syntax and entry exit finance calculations
        run: |
          python -m py_compile ph1_backtest/h1_first_break_tp10_sl5.py
          python -u ph1_backtest/h1_first_break_tp10_sl5.py --selftest
      - name: Download original Exness public raw bid-ask archives and replay tick by tick
        run: |
          set -o pipefail
          mkdir -p results/${{ matrix.year }}
          python -u ph1_backtest/h1_first_break_tp10_sl5.py --year ${{ matrix.year }} --out results/${{ matrix.year }} 2>&1 | tee results/${{ matrix.year }}/execution.log
      - name: Upload all evidence logs and transaction records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H1-first-break-TP10-SL5-${{ matrix.year }}
          path: results/${{ matrix.year }}/
          if-no-files-found: warn
          retention-days: 30
