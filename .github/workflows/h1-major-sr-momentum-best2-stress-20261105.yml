name: XAUUSD Major SR best two momentum strategies slippage 2020-26
on:
  push:
    branches: [h1-major-sr-40models-20261105]
    paths:
      - "ph1_backtest/h1_major_sr_momentum_best2_slippage_stress.py"
      - ".github/workflows/h1-major-sr-momentum-best2-stress-20261105.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    name: Major SR momentum stress ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        year: [2020,2021,2022,2023,2024,2025,2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical dependencies
        run: pip install "numpy==2.2.6" "pandas==2.2.3" "numba==0.61.2" "requests==2.32.5" "tzdata==2026.6"
      - name: Python and major SR strategy selftest
        run: |
          python -m py_compile ph1_backtest/h1_major_sr_momentum_best2_slippage_stress.py
          python -u ph1_backtest/h1_major_sr_momentum_best2_slippage_stress.py --selftest
      - name: Replay audited Exness Raw Spread Bid Ask ticks
        run: |
          set -o pipefail
          mkdir -p results/${{ matrix.year }}
          python -u ph1_backtest/h1_major_sr_momentum_best2_slippage_stress.py --year ${{ matrix.year }} --out results/${{ matrix.year }} 2>&1 | tee results/${{ matrix.year }}/execution.log
      - name: Publish selected strategy stress trade ledgers and source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H1-MajorSR-Momentum-Best2-Stress-${{ matrix.year }}
          path: results/${{ matrix.year }}/
          retention-days: 30
          if-no-files-found: warn
