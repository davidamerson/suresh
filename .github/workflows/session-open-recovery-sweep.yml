name: Four Session $5 Controlled Recovery Sweep

on:
  push:
    branches: [ph1-actions-backtest]
  workflow_dispatch:

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        year: [2025, 2026]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'requests==2.32.5'
      - run: python -m py_compile ph1_backtest/session_open_independent_groups.py ph1_backtest/session_open_recovery_sweep.py
      - name: Run recovery sweep
        run: |
          mkdir -p recovery_${{ matrix.year }}
          python ph1_backtest/session_open_recovery_sweep.py --year ${{ matrix.year }} --outdir recovery_${{ matrix.year }} | tee recovery_${{ matrix.year }}/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: session-recovery-sweep-${{ matrix.year }}
          path: recovery_${{ matrix.year }}/
          retention-days: 30
