name: XAUUSD Major SR continuous no-weekend final Thursday-noon test
on:
  push:
    branches: [major-sr-continuous-1000-dedup-friday-swap-hmr-20261105]
    paths:
      - "ph1_backtest/major_sr_continuous_earlier_holiday_and_thursday_noon.py"
      - ".github/workflows/major-sr-continuous-weekend-guarantee-thu12.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    name: Holiday-aware noon and all-Thursday noon 7-year continuous 
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: pip install "numpy==2.2.6" "pandas==2.2.3" "numba==0.61.2" "requests==2.32.5" "tzdata==2026.6"
      - name: Validate unchanged S R setup and safe weekend settings
        run: |
          python -m py_compile ph1_backtest/major_sr_continuous_earlier_holiday_and_thursday_noon.py
          python -u ph1_backtest/major_sr_continuous_earlier_holiday_and_thursday_noon.py --selftest
      - name: Replay all real Exness gold ticks from 2020 Jan29 through 2026 Nov05
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/continuous_2020_2026
          python -u ph1_backtest/major_sr_continuous_earlier_holiday_and_thursday_noon.py --out results/continuous_2020_2026 2>&1 | tee results/continuous_2020_2026/execution.log
      - name: Preserve trade ledger and source SHA256 for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MajorSR-Continuous-Guaranteed-Weekend-Thu12-2020-26
          path: results/continuous_2020_2026/
          retention-days: 30
          if-no-files-found: warn
