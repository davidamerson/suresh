name: Build both Android TV applications
on:
  push:
    branches: [sltv-two-tv-apps-20261109]
    paths: [".github/workflows/build-sltv-tv-apps.yml", "common/src/main/java/lk/openstream/tv/common/TvMenuActivity.java"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sltv-two-tv-apps-20261109
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify or install Android SDK platform 35
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          if [ -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            echo "Android SDK 35 is preinstalled."
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
            if [ -z "$SDKMANAGER" ]; then echo "SDK Manager not found"; exit 1; fi
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Recover complete researched 174-channel catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sltv_artifact
          gh run download 42587789205 --repo "$GITHUB_REPOSITORY" \
            --name sltv-authorized-urls-redacted --dir /tmp/sltv_artifact
          python3 scripts/import_capture.py /tmp/sltv_artifact/cached_channel_paths_redacted.json
      - name: Publish updateable public channel metadata
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/channels.json common/src/main/assets/channels.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh 174-channel redacted-source catalogue"
            git push origin HEAD:sltv-two-tv-apps-20261109 || echo "Catalog push failed; generated local catalogue will still be compiled."
          fi
      - name: Compile both original Android TV APKs
        run: |
          gradle --version
          gradle --no-daemon :independent:assembleDebug :companion:assembleDebug --stacktrace
      - name: Upload both APKs and catalogue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenStreamTV-and-SLTV-Companion-debug-APKs
          path: |
            independent/build/outputs/apk/debug/*.apk
            companion/build/outputs/apk/debug/*.apk
            catalog/channels.json
          retention-days: 30
          if-no-files-found: warn
