name: XAUUSD H1 First Break 0.01 lot TP100 SL25 RealTick
on:
  push:
    branches: [h1-tp100-sl25-001-test]
    paths:
      - "ph1_backtest/h1_tp100_sl25_001.py"
      - ".github/workflows/h1-tp100-sl25-001.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    name: 0.01 lot TP100 SL25 ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        year: [2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: pip install "numpy==2.2.6" "pandas==2.2.3" "numba==0.61.2" "requests==2.32.5" "tzdata==2026.6"
      - name: Verify execution and financial arithmetic
        run: |
          python -m py_compile ph1_backtest/h1_tp100_sl25_001.py
          python -u ph1_backtest/h1_tp100_sl25_001.py --selftest
      - name: Download original public Exness XAUUSD Raw Spread archives and replay all ticks
        run: |
          set -o pipefail
          mkdir -p results/${{ matrix.year }}
          python -u ph1_backtest/h1_tp100_sl25_001.py --year ${{ matrix.year }} --out results/${{ matrix.year }} 2>&1 | tee results/${{ matrix.year }}/execution.log
      - name: Upload reproducible reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XAU-H1-TP100-SL25-001-${{ matrix.year }}
          path: results/${{ matrix.year }}/
          if-no-files-found: warn
          retention-days: 30
