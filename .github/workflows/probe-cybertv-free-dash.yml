name: Verify decoded CyberTV DASH streams without DRM bypass
on:
  push:
    branches: [cybertv-tv-app-20261108]
    paths: [".github/workflows/probe-cybertv-free-dash.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cybertv-tv-app-20261108
      - name: Download original CyberTV APK and tools
        run: |
          set -e
          curl -L --fail --silent --show-error --max-time 95 -A "Mozilla/5.0" "https://cybertv.fifamatch.online/Cyber%20Tv%20V3_1.apk" -o cybertv.apk
          python3 -m pip install --quiet "frida==16.6.6"
          FVER=$(python3 -c "import frida;print(frida.__version__)")
          curl -L --fail --silent --show-error --max-time 120 "https://github.com/frida/frida/releases/download/$FVER/frida-server-$FVER-android-x86_64.xz" -o frida.xz
          xz -dc frida.xz > frida-server
          chmod +x frida-server
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Convert free channel records and test MPD/frames without keys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          script: |
            adb install -r cybertv.apk
            adb root
            adb wait-for-device
            adb push frida-server /data/local/tmp/frida-server
            adb shell chmod 755 /data/local/tmp/frida-server
            adb shell 'nohup /data/local/tmp/frida-server >/dev/null 2>&1 </dev/null &'
            adb shell monkey -p com.cy.cybertv -c android.intent.category.LAUNCHER 1
            sleep 6
            python3 -m cybertv_app_research.video_probe
