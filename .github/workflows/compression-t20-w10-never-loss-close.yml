name: Compression T20 W10 Never-Loss-Close
on:
  push:
    branches: [ph1-actions-backtest]
    paths:
      - '.github/workflows/compression-t20-w10-never-loss-close.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    strategy:
      matrix:
        year: [2025, 2026]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'numba==0.61.2' 'requests==2.32.5'
      - name: Prepare exact never-loss-close variant
        run: |
          cp ph1_backtest/entry10_adaptive_sweep.py /tmp/neverloss.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/neverloss.py')
          s = p.read_text()
          s = s.replace('TARGET = 10.0', 'TARGET = 20.0\nWITHDRAW = 10.0')
          s = s.replace('balance[cidx] -= TARGET', 'balance[cidx] -= WITHDRAW')
          s = s.replace('withdrawn[cidx] += TARGET', 'withdrawn[cidx] += WITHDRAW')
          # Preserve every other strategy rule, but NEVER realize a losing basket on Friday/year-end.
          s = s.replace('if prev_dow == 4:', 'if False and prev_dow == 4:')
          s = s.replace('if (last_day + 3) % 7 == 4:', 'if False and (last_day + 3) % 7 == 4:')
          p.write_text(s)
          PY
          python -m py_compile /tmp/neverloss.py
          echo '--- rule verification ---'
          grep -n 'TARGET\|WITHDRAW\|False and prev_dow\|False and (last_day' /tmp/neverloss.py
      - name: Run raw-tick replay
        run: |
          mkdir -p neverloss_${{ matrix.year }}
          python /tmp/neverloss.py --year ${{ matrix.year }} --outdir neverloss_${{ matrix.year }} | tee neverloss_${{ matrix.year }}/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compression-t20-w10-neverloss-${{ matrix.year }}
          path: neverloss_${{ matrix.year }}/
          retention-days: 30
