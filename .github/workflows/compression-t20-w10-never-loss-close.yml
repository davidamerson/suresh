name: Compression Equity Guard Micro Sweep
on:
  push:
    branches: [ph1-actions-backtest]
    paths:
      - '.github/workflows/compression-t20-w10-never-loss-close.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        year: [2025, 2026]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'numba==0.61.2' 'requests==2.32.5'
      - name: Build equity-guard sweep
        run: |
          python ph1_backtest/build_equity_guard_sweep.py
          python -m py_compile /tmp/eqguard.py
          echo '--- rule verification ---'
          grep -n 'TARGET\|WITHDRAW\|def allow_add\|False and prev_dow' /tmp/eqguard.py | head -40
      - name: Run raw-tick sweep
        run: |
          mkdir -p eqguard_${{ matrix.year }}
          python /tmp/eqguard.py --year ${{ matrix.year }} --outdir eqguard_${{ matrix.year }} | tee eqguard_${{ matrix.year }}/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compression-equity-guard-${{ matrix.year }}
          path: eqguard_${{ matrix.year }}/
          retention-days: 30