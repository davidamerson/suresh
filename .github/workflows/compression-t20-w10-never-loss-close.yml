name: H1 Breakout Compression EQ65 Test
on:
  push:
    branches: [ph1-actions-backtest]
    paths:
      - '.github/workflows/compression-t20-w10-never-loss-close.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        year: [2025, 2026]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'numba==0.61.2' 'requests==2.32.5'
      - name: Build exact H1 Compression test
        run: |
          python ph1_backtest/build_h1_compression_guard.py
          python -m py_compile /tmp/h1_compression.py
          echo '--- rule verification ---'
          grep -n 'TARGET\|WITHDRAW\|H1_COMPRESSION\|compression_gap\|allow_compression_add\|False and prev_dow\|dow >= 4' /tmp/h1_compression.py | head -60
      - name: Run raw-tick replay
        run: |
          mkdir -p h1comp_${{ matrix.year }}
          python /tmp/h1_compression.py --year ${{ matrix.year }} --outdir h1comp_${{ matrix.year }} | tee h1comp_${{ matrix.year }}/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1-compression-eq65-${{ matrix.year }}
          path: h1comp_${{ matrix.year }}/
          retention-days: 30