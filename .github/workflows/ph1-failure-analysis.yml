name: PH1 Failure Signature Analysis
on:
  push:
    branches: [ph1-user-faithful]
    paths:
      - 'ph1_mathgrid/failure_analyzer.cpp'
      - 'ph1_mathgrid/analyze_failure.py'
      - '.github/workflows/ph1-failure-analysis.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build analyzer
        run: |
          g++ -O3 -std=c++20 ph1_mathgrid/failure_analyzer.cpp -o ph1_mathgrid/failure_analyzer
          mkdir -p data analysis
      - name: Download raw Exness months
        shell: bash
        run: |
          set -euo pipefail
          for Y in 2025 2026; do
            if [ "$Y" = 2025 ]; then MONTHS='01 02 03 04 05 06 07 08 09 10 11 12'; else MONTHS='01 02 03 04 05 06 07 08 09 10'; fi
            mkdir -p "data/$Y"
            for M in $MONTHS; do
              URL="https://ticks.ex2archive.com/ticks/XAUUSD_Raw_Spread/${Y}/${M}/Exness_XAUUSD_Raw_Spread_${Y}_${M}.zip"
              curl -L --fail --retry 5 --retry-delay 2 "$URL" -o "data/$Y/$M.zip"
            done
          done
      - name: Analyze 2025 and 2026 episodes
        shell: bash
        run: |
          set -euo pipefail
          (for M in 01 02 03 04 05 06 07 08 09 10 11 12; do unzip -p "data/2025/$M.zip"; done) | ./ph1_mathgrid/failure_analyzer analysis/2025
          (for M in 01 02 03 04 05 06 07 08 09 10; do unzip -p "data/2026/$M.zip"; done) | ./ph1_mathgrid/failure_analyzer analysis/2026
      - name: Compare failure signatures
        run: python3 ph1_mathgrid/analyze_failure.py | tee analysis/failure_summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PH1-Failure-Signature-Analysis
          path: analysis/
          retention-days: 7
