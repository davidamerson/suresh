name: Four Session Recovery Risk Research (Full Tick 2025-2026)
on:
  push:
    branches: [four-session-risk-research]
    paths:
      - "ph1_backtest/four_session_risk_candidates.py"
      - ".github/workflows/four-session-risk-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Full RealTick ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        year: [2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: pip install "numpy==2.2.6" "pandas==2.2.3" "numba==0.61.2" "requests==2.32.5" "tzdata==2026.6"
      - name: Validate engine
        run: python -m py_compile ph1_backtest/four_session_risk_candidates.py
      - name: Full historical real tick replay and 12 candidate comparison
        run: |
          set -o pipefail
          mkdir -p results/${{ matrix.year }}
          python -u ph1_backtest/four_session_risk_candidates.py --year ${{ matrix.year }} --out results/${{ matrix.year }} 2>&1 | tee results/${{ matrix.year }}/run.log
      - name: Upload reports and source fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-session-risk-full-${{ matrix.year }}
          path: results/${{ matrix.year }}/
          if-no-files-found: warn
          retention-days: 30
