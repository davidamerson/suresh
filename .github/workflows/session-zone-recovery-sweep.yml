name: Session Boundary Zone Recovery Sweep
on:
  workflow_dispatch:
  push:
    branches: [ph1-actions-backtest]
    paths:
      - 'ph1_backtest/session_zone_recovery_sweep.py'
      - '.github/workflows/session-zone-recovery-sweep.yml'

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        year: [2025, 2026]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'requests==2.32.5'
      - run: python -m py_compile ph1_backtest/session_open_independent_groups.py ph1_backtest/session_zone_recovery_sweep.py
      - name: Run boundary zone recovery sweep
        run: |
          mkdir -p zr_${{ matrix.year }}
          python ph1_backtest/session_zone_recovery_sweep.py --year ${{ matrix.year }} --outdir zr_${{ matrix.year }} | tee zr_${{ matrix.year }}/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: session-zone-recovery-${{ matrix.year }}
          path: zr_${{ matrix.year }}/
          retention-days: 30
