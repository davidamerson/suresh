name: Classify HD server JSON without secrets
on:
  push:
    branches: [sltv-hd-logo-20261110]
    paths: [".github/workflows/sltv-json-diagnostic.yml","scripts/sltv_json_diag.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/sltv_json_diag.py
