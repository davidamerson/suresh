name: Daily Sri Lanka free TV stream verification
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-tv-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out independent TV branch only
        uses: actions/checkout@v4
        with:
          ref: srilanka-tv-verification-20261108
          persist-credentials: true
      - name: Install decoder
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
      - name: Recheck real public stream video frames
        run: python3 -u tv/check_streams.py
      - name: Publish updated TV playlist and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv/playlist.m3u tv/report.md tv/results.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily verification of free Sri Lankan TV streams"
            git push origin HEAD:srilanka-tv-verification-20261108
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sri-lanka-tv-latest-verification
          path: |
            tv/playlist.m3u
            tv/report.md
            tv/results.json
