name: Fresh XAUUSD Scalper Research
on:
  push:
    branches: [ph1-actions-backtest]
    paths:
      - 'ph1_backtest/fresh_xau_scalper_research.py'
      - '.github/workflows/fresh-xau-scalper-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'requests==2.32.5'
      - name: Verify code
        run: python -m py_compile ph1_backtest/fresh_xau_scalper_research.py
      - name: Run development and out-of-sample backtest
        run: |
          mkdir -p fresh_scalper_results
          python ph1_backtest/fresh_xau_scalper_research.py --outdir fresh_scalper_results | tee fresh_scalper_results/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-xau-scalper-results
          path: fresh_scalper_results/
          retention-days: 30
