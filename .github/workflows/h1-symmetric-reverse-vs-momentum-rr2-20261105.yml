name: XAUUSD H1 reverse and breakout symmetric RR2 2020-2026 tick replay
on:
  push:
    branches: [h1-reverse-vs-breakout-symmetric-40-20261105]
    paths:
      - "ph1_backtest/h1_symmetric_reverse_vs_momentum_rr2_2020_2026.py"
      - ".github/workflows/h1-symmetric-reverse-vs-momentum-rr2-20261105.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    name: XAUUSD RR2 20 models ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        year: [2020,2021,2022,2023,2024,2025,2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact dependencies
        run: pip install "numpy==2.2.6" "pandas==2.2.3" "numba==0.61.2" "requests==2.32.5" "tzdata==2026.6"
      - name: Syntax and 20-configuration reverse momentum selfchecks
        run: |
          python -m py_compile ph1_backtest/h1_symmetric_reverse_vs_momentum_rr2_2020_2026.py
          python -u ph1_backtest/h1_symmetric_reverse_vs_momentum_rr2_2020_2026.py --selftest
      - name: Replay source Exness XAUUSD Raw Spread Bid Ask ticks
        run: |
          set -o pipefail
          mkdir -p results/${{ matrix.year }}
          python -u ph1_backtest/h1_symmetric_reverse_vs_momentum_rr2_2020_2026.py --year ${{ matrix.year }} --out results/${{ matrix.year }} 2>&1 | tee results/${{ matrix.year }}/execution.log
      - name: Upload summary trade ledger high low breakout audit and tick SHA256
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H1-Symmetric-RR2-20models-${{ matrix.year }}
          path: results/${{ matrix.year }}/
          retention-days: 30
          if-no-files-found: warn
