name: PMRR-D Late Recovery Search

on:
  push:
    branches: [pmrr-2025-blind]
    paths:
      - 'pmrr_remote/pmrr_gap_backtest.cpp'
      - '.github/workflows/pmrr-gap-search.yml'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          g++ -O3 -std=c++20 pmrr_remote/pmrr_gap_backtest.cpp -o pmrr_remote/pmrr_gap_backtest
          mkdir -p results_gap
      - name: Calibration BASE October 2026
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://ticks.ex2archive.com/ticks/XAUUSD_Raw_Spread/2026/10/Exness_XAUUSD_Raw_Spread_2026_10.zip' -o /tmp/cal.zip
          unzip -p /tmp/cal.zip | ./pmrr_remote/pmrr_gap_backtest BASE > /tmp/cal.csv
          python3 pmrr_remote/summarize.py --calibrate /tmp/cal.csv
      - name: Test 2025 four end-time modes
        run: |
          set -euo pipefail
          MODES='BASE EXTREV EXTHOLD EXTWIDE'
          for M in 01 02 03 04 05 06 07 08 09 10 11 12; do
            URL="https://ticks.ex2archive.com/ticks/XAUUSD_Raw_Spread/2025/${M}/Exness_XAUUSD_Raw_Spread_2025_${M}.zip"
            curl -L --fail --retry 5 "$URL" -o "/tmp/m_${M}.zip"
            for MODE in $MODES; do
              unzip -p "/tmp/m_${M}.zip" | ./pmrr_remote/pmrr_gap_backtest "$MODE" > "results_gap/${MODE}_${M}.csv"
            done
            rm -f "/tmp/m_${M}.zip"
          done
          python3 - <<'PY'
          import csv,glob,os,json
          modes=['BASE','EXTREV','EXTHOLD','EXTWIDE']
          for mode in modes:
              rows=[]
              for p in sorted(glob.glob(f'results_gap/{mode}_*.csv')):
                  with open(p) as f:
                      for r in csv.DictReader(f):
                          r['p']=float(r['final_pnl']);r['hit']=int(r['target_hit']);r['rev']=int(r['reversals']);r['dd']=float(r['min_liq']);rows.append(r)
              traded=[r for r in rows if not (r['p']==0 and r['rev']==0 and r['hit']==0)]
              losses=[r for r in traded if r['p']<=0]
              out={'mode':mode,'calendar_rows':len(rows),'traded_days':len(traded),'positive':sum(r['p']>0 for r in traded),'target_hits':sum(r['hit'] for r in traded),'total_pnl':round(sum(r['p'] for r in traded),6),'worst_close':min(r['p'] for r in traded),'worst_intraday':min(r['dd'] for r in traded),'max_reversals':max(r['rev'] for r in traded),'losses':[{'date':r['date'],'pnl':r['p'],'rev':r['rev'],'dd':r['dd'],'exit':r['exit_reason'],'time':r['exit_time']} for r in losses]}
              print('MODE_SUMMARY '+json.dumps(out,sort_keys=True))
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PMRR-D-late-recovery-search
          path: results_gap/
          retention-days: 7
