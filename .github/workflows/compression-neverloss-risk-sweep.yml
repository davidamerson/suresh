name: Fresh XAUUSD Scalper Compute Harness
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compression-neverloss-risk-sweep.yml'

permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'requests==2.32.5'
      - name: Verify fresh research code
        run: |
          python -m py_compile ph1_backtest/fresh_xau_scalper_research.py
          python -m py_compile ph1_backtest/fresh_xau_scalper_fast_runner.py
      - name: Run fresh development and out-of-sample backtest
        run: |
          mkdir -p fresh_scalper_fast_results
          cd ph1_backtest
          python fresh_xau_scalper_fast_runner.py --outdir ../fresh_scalper_fast_results | tee ../fresh_scalper_fast_results/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-xau-scalper-fast-results
          path: fresh_scalper_fast_results/
          retention-days: 30
