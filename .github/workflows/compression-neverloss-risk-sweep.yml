name: Fresh XAUUSD Day Trading Research
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compression-neverloss-risk-sweep.yml'
      - 'ph1_backtest/fresh_xau_daytrader_research.py'
      - 'ph1_backtest/fresh_xau_daytrader_fast.py'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'requests==2.32.5'
      - name: Verify fresh day-trading code
        run: |
          python -m py_compile ph1_backtest/fresh_xau_daytrader_research.py
          python -m py_compile ph1_backtest/fresh_xau_daytrader_fast.py
      - name: Run staged 2024 development and 2025-2026 untouched validation
        run: |
          mkdir -p fresh_daytrade_results
          cd ph1_backtest
          python fresh_xau_daytrader_fast.py --outdir ../fresh_daytrade_results | tee ../fresh_daytrade_results/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-xau-daytrader-results
          path: fresh_daytrade_results/
          retention-days: 30
