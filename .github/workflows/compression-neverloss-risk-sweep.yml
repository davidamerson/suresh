name: External OOS XAUUSD Trade-Log Replay
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compression-neverloss-risk-sweep.yml'
      - 'ph1_backtest/external_oos_daily20_replay.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas==2.2.3' 'requests==2.32.5'
      - run: python -m py_compile ph1_backtest/external_oos_daily20_replay.py
      - name: Replay published OOS R-multiples with $1000 / +20 / withdraw10 rules
        run: |
          mkdir -p external_replay
          python ph1_backtest/external_oos_daily20_replay.py --outdir external_replay | tee external_replay/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-oos-daily20-replay
          path: external_replay/
          retention-days: 30
