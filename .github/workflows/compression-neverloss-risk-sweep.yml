name: Compression NeverLoss Risk Sweep
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compression-neverloss-risk-sweep.yml'

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        year: [2025, 2026]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'numba==0.61.2' 'requests==2.32.5'
      - name: Build risk-control sweep
        run: |
          cp ph1_backtest/entry10_adaptive_sweep.py /tmp/risk.py
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/risk.py')
          s=p.read_text()
          names=[
            'BASELINE',
            'POSCAP_12',
            'POSCAP_16',
            'NET_EXPOSURE_CAP_2',
            'HEDGE_ONLY_AFTER_8',
            'HEDGE_ONLY_AFTER_SWITCH2',
            'EQUITY_HEDGE_BELOW_65PCT',
            'GAP_X2_AFTER_SWITCH2',
            'GAP_X3_AFTER_SWITCH3',
            'NETCAP2_GAPX2',
            'DANGER_HEDGE_GAPX3',
            'BALANCED_COMBO'
          ]
          s=re.sub(r'METHODS = \[.*?\]\n\n', 'METHODS = '+repr(names)+'\n\n', s, count=1, flags=re.S)
          s=s.replace('TARGET = 10.0', 'TARGET = 20.0\nWITHDRAW = 10.0')
          s=s.replace('balance[cidx] -= TARGET', 'balance[cidx] -= WITHDRAW')
          s=s.replace('withdrawn[cidx] += TARGET', 'withdrawn[cidx] += WITHDRAW')
          # Never realize a loss at Friday/year-end.
          s=s.replace('if prev_dow == 4:', 'if False and prev_dow == 4:')
          s=s.replace('if (last_day + 3) % 7 == 4:', 'if False and (last_day + 3) % 7 == 4:')
          # Every config receives the exact same COMPRESSION_BREAKOUT entry signals (original index 3).
          needle='    times = np.full((len(METHODS), maxn), np.iinfo(np.int64).max, dtype=np.int64)'
          repl=('    base_rows = list(cleaned[3])\n'
                '    cleaned = [list(base_rows) for _ in METHODS]\n'
                '    maxn = max(1, len(base_rows))\n'
                + needle)
          if needle not in s: raise SystemExit('signal-array needle missing')
          s=s.replace(needle,repl,1)
          # Risk functions. They NEVER close a losing basket; they only control whether/where another 0.01 order may be added.
          needle2='@njit(cache=True)\ndef process_ticks'
          funcs=r'''@njit(cache=True)
def gap_for_config(cidx, switches):
    g = gap_from_switches(switches)
    if cidx == 7 and switches >= 2:
        return g * 2.0
    if cidx == 8 and switches >= 3:
        return g * 3.0
    if cidx == 9 and switches >= 2:
        return g * 2.0
    if cidx == 10 and switches >= 2:
        return g * 3.0
    if cidx == 11 and switches >= 3:
        return g * 2.0
    return g

@njit(cache=True)
def allow_add(cidx, direction, open_n, buy_n, sell_n, switches, liq, balance):
    net = buy_n - sell_n
    new_net = net + (1 if direction > 0 else -1)
    reducing = abs(new_net) < abs(net)
    eq = balance + liq

    if cidx == 1:  # hard inventory freeze at 12; hold, never close loss
        return open_n < 12
    if cidx == 2:
        return open_n < 16
    if cidx == 3:  # always cap directional imbalance
        return abs(new_net) <= 2
    if cidx == 4 and open_n >= 8:
        return reducing
    if cidx == 5 and switches >= 2:
        return reducing
    if cidx == 6 and eq < 0.65 * balance:
        return reducing
    if cidx == 9:
        return abs(new_net) <= 2
    if cidx == 10 and (open_n >= 8 or switches >= 2 or eq < 0.75 * balance):
        return reducing
    if cidx == 11:
        if open_n >= 16:
            return False
        if abs(new_net) > 3:
            return False
        if eq < 0.60 * balance and not reducing:
            return False
    return True

@njit(cache=True)
def process_ticks'''
          if needle2 not in s: raise SystemExit('process needle missing')
          s=s.replace(needle2,funcs,1)
          # Use config-specific expanded gap after each actual add.
          s=s.replace('g = gap_from_switches(switches[cidx])', 'g = gap_for_config(cidx, switches[cidx])')
          # Gate BUY/SELL additions only; initial entry is untouched.
          buyneedle='''                        else:\n                            fill = ask\n                            eq = balance[cidx] + liq'''
          buyrepl='''                        else:\n                            if not allow_add(cidx, 1, open_n[cidx], buy_n[cidx], sell_n[cidx], switches[cidx], liq, balance[cidx]):\n                                break\n                            fill = ask\n                            eq = balance[cidx] + liq'''
          sellneedle='''                        else:\n                            fill = bid\n                            eq = balance[cidx] + liq'''
          sellrepl='''                        else:\n                            if not allow_add(cidx, -1, open_n[cidx], buy_n[cidx], sell_n[cidx], switches[cidx], liq, balance[cidx]):\n                                break\n                            fill = bid\n                            eq = balance[cidx] + liq'''
          if buyneedle not in s: raise SystemExit('buy gate needle missing')
          if sellneedle not in s: raise SystemExit('sell gate needle missing')
          s=s.replace(buyneedle,buyrepl,1).replace(sellneedle,sellrepl,1)
          p.write_text(s)
          PY
          python -m py_compile /tmp/risk.py
          grep -n 'TARGET\|WITHDRAW\|def allow_add\|def gap_for_config\|False and prev_dow' /tmp/risk.py | head -30
      - name: Run raw-tick sweep
        run: |
          mkdir -p risk_${{ matrix.year }}
          python /tmp/risk.py --year ${{ matrix.year }} --outdir risk_${{ matrix.year }} | tee risk_${{ matrix.year }}/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: compression-neverloss-risk-${{ matrix.year }}
          path: risk_${{ matrix.year }}/
          retention-days: 30
