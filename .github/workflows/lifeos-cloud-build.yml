name: Cloud Build Suresh Life OS

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/lifeos-cloud-build.yml'
  workflow_dispatch:

# v1.5 final source refresh 2
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Life OS build branch
        uses: actions/checkout@v4
        with:
          ref: lifeos-build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: lifeosapp
        run: gradle --no-daemon assembleRelease

      - name: Prepare unsigned release APK and signer
        shell: bash
        run: |
          mkdir -p dist tools
          cp lifeosapp/app/build/outputs/apk/release/app-release-unsigned.apk dist/Suresh-Life-OS-v1.5-unsigned.apk
          sha256sum dist/Suresh-Life-OS-v1.5-unsigned.apk | tee dist/SHA256SUMS.txt
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -1)
          APKSIGNER_JAR=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner.jar 2>/dev/null | sort -V | tail -1)
          cp "$APKSIGNER_JAR" tools/apksigner.jar
          {
            echo "=== APK BADGING ==="
            "$AAPT" dump badging dist/Suresh-Life-OS-v1.5-unsigned.apk
          } > dist/BUILD-INFO.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suresh-Life-OS-v1.5-release-unsigned
          path: |
            dist/
            tools/apksigner.jar
          if-no-files-found: error
