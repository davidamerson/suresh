name: Compression 2026 Forensic
on:
  push:
    branches: [ph1-actions-backtest]
    paths:
      - 'forensics/compression_2026_forensic.py'
      - '.github/workflows/compression-2026-forensic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'numba==0.61.2' 'requests==2.32.5'
      - run: python -m py_compile forensics/compression_2026_forensic.py
      - run: python forensics/compression_2026_forensic.py | tee compression_forensic/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compression-2026-forensic
          path: compression_forensic/
          retention-days: 30
