name: Corrected Four Session First-Break $5 Groups

on:
  push:
    branches: [ph1-actions-backtest]
  workflow_dispatch:

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        year: [2025, 2026]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'requests==2.32.5'
      - run: python -m py_compile ph1_backtest/session_open_independent_groups.py ph1_backtest/session_open_firstbreak_5usd.py
      - name: Run corrected backtest
        run: |
          mkdir -p corrected_session_${{ matrix.year }}
          python ph1_backtest/session_open_firstbreak_5usd.py --year ${{ matrix.year }} --outdir corrected_session_${{ matrix.year }} | tee corrected_session_${{ matrix.year }}/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-session-firstbreak-5usd-${{ matrix.year }}
          path: corrected_session_${{ matrix.year }}/
          retention-days: 30
