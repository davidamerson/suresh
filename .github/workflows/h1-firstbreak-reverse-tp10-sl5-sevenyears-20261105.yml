name: XAUUSD H1 REVERSE first-break TP10 SL5 seven-year raw-tick replay
on:
  push:
    branches: [h1-reverse-tp10-sl5-sevenyears-20261105]
    paths:
      - "ph1_backtest/h1_firstbreak_reverse_tp10_sl5_2020_2026.py"
      - ".github/workflows/h1-firstbreak-reverse-tp10-sl5-sevenyears-20261105.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    name: XAUUSD FADE TP10 SL5 ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        year: [2020,2021,2022,2023,2024,2025,2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: pip install "numpy==2.2.6" "pandas==2.2.3" "numba==0.61.2" "requests==2.32.5" "tzdata==2026.6"
      - name: Syntax, reverse entry, and BUY SELL payout selftest
        run: |
          python -m py_compile ph1_backtest/h1_firstbreak_reverse_tp10_sl5_2020_2026.py
          python -u ph1_backtest/h1_firstbreak_reverse_tp10_sl5_2020_2026.py --selftest
      - name: Direct Exness quote archive download and tick replay
        run: |
          set -o pipefail
          mkdir -p results/${{ matrix.year }}
          python -u ph1_backtest/h1_firstbreak_reverse_tp10_sl5_2020_2026.py --year ${{ matrix.year }} --out results/${{ matrix.year }} 2>&1 | tee results/${{ matrix.year }}/execution.log
      - name: Upload per-year results and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H1-FADE-TP10-SL5-${{ matrix.year }}
          path: results/${{ matrix.year }}/
          retention-days: 30
          if-no-files-found: warn
