name: Build HD diagnostics and channel logo TV apps
on:
  push:
    branches: [sltv-hd-logo-20261110]
    paths:
      - ".github/workflows/build-sltv-v03.yml"
      - "SriLankaTV/**"
      - "scripts/sltv_enrich_logos.py"
      - "scripts/sltv_input_smoke.sh"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate exact-match public logos
        run: |
          set -euo pipefail
          python3 -u scripts/sltv_enrich_logos.py
          test "$(grep -c 'tvg-logo=' SriLankaTV/app/src/main/assets/verified_channels.m3u)" -ge 65
      - name: Commit enriched channel logo metadata
        run: |
          set -euo pipefail
          git config user.name 'sltv-app-build-bot'
          git config user.email 'sltv-app-build-bot@users.noreply.github.com'
          git add SriLankaTV/app/src/main/assets/verified_channels.m3u sltv_logo_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Store exact-match public TV channel logo references'
            git push origin HEAD:sltv-hd-logo-20261110
          fi
      - name: Build all three flavors
        working-directory: SriLankaTV
        run: gradle --no-daemon --stacktrace :app:assembleStandaloneDebug :app:assembleSltvbridgeDebug :app:assemblePhoneDebug
      - name: Check package identities and save the three APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output_apks
          cp SriLankaTV/app/build/outputs/apk/standalone/debug/app-standalone-debug.apk output_apks/SLTV_Independent_TV_Remote_Mouse.apk
          cp SriLankaTV/app/build/outputs/apk/sltvbridge/debug/app-sltvbridge-debug.apk output_apks/SLTV_Channel_Bridge_TV_Remote_Mouse.apk
          cp SriLankaTV/app/build/outputs/apk/phone/debug/app-phone-debug.apk output_apks/Sri_Lanka_TV_Android_Phone.apk
          cp output_apks/SLTV_Independent_TV_Remote_Mouse.apk output_apks/SLTV_Independent_v03.apk
          cp output_apks/SLTV_Channel_Bridge_TV_Remote_Mouse.apk output_apks/SLTV_Bridge_Normal_HD_v03.apk
          cp output_apks/Sri_Lanka_TV_Android_Phone.apk output_apks/SLTV_Android_Phone_v03.apk
          for file in output_apks/*.apk; do
            test -s "$file"
            echo "APK $file"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$file" | grep -E "^package:|^launchable-activity:" || true
            sha256sum "$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: SLTV-v03-Normal-HD-Logo-APKs
          path: output_apks/*.apk
          retention-days: 30
          if-no-files-found: error
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise D-pad and touch/mouse selection
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/sltv_input_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SLTV-v03-Remote-Mouse-Logo-Test-Evidence
          path: smoke-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Publish direct APK downloads in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='sltv-v0.3-20261110'
          notes='SLTV v0.3: Normal and HD channel entries in the bridge, exact-match logos, HD Widevine diagnostics and normal-stream fallback. HD DRM playback still requires proper broadcaster authorization. Successful build and emulator smoke test.'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" output_apks/SLTV_Independent_v03.apk output_apks/SLTV_Bridge_Normal_HD_v03.apk output_apks/SLTV_Android_Phone_v03.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" output_apks/SLTV_Independent_v03.apk output_apks/SLTV_Bridge_Normal_HD_v03.apk output_apks/SLTV_Android_Phone_v03.apk --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title 'SLTV v0.3: Normal, HD diagnostics and logos' --notes "$notes" --latest=false
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
