name: H4 Major Trend Change 10 RR3 strategies 2020-26 XAUUSD
on:
  push:
    branches: [major-trend-h4-structure-change-rr3-10models-20261106]
    paths:
      - "ph1_backtest/h4_major_trend_change_rr3_ten_variants_2020_2026.py"
      - ".github/workflows/h4-major-trend-change-rr3-10models.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    name: H4 confirmed major trend change and ten TP SL combinations
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: pip install "numpy==2.2.6" "pandas==2.2.3" "numba==0.61.2" "requests==2.32.5" "tzdata==2026.6"
      - name: Test H4 trend reversal causal signal and all 10 fixed RR3 models
        run: |
          python -m py_compile ph1_backtest/h4_major_trend_change_rr3_ten_variants_2020_2026.py
          python -u ph1_backtest/h4_major_trend_change_rr3_ten_variants_2020_2026.py --selftest
      - name: Full Exness Raw Spread tick replay 2020 Jan29 to 2026 Nov05
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/continuous_2020_2026
          python -u ph1_backtest/h4_major_trend_change_rr3_ten_variants_2020_2026.py --out results/continuous_2020_2026 2>&1 | tee results/continuous_2020_2026/execution.log
      - name: Retain ten model results source hashes, full ticket ledger and equity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-H4MajorTrendChange-RR3-10Models-2020-2026
          path: results/continuous_2020_2026/
          retention-days: 30
          if-no-files-found: warn
