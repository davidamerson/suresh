name: H1 Original Spacing Halfway Hedge Test
on:
  push:
    branches: [ph1-actions-backtest]
    paths:
      - 'ph1_backtest/build_halfway_variant.py'
      - '.github/workflows/h1-halfway-hedge-system.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        year: [2025, 2026]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'numba==0.61.2' 'requests==2.32.5'
      - name: Build and verify exact halfway-hedge variant
        run: |
          python ph1_backtest/build_halfway_variant.py
          python -m py_compile ph1_backtest/h1_halfway_hedge_system.py
          grep -n 'ORIGINAL main spacing\|Halfway point\|rule_main_levels_pips\|rule_hedges' ph1_backtest/h1_halfway_hedge_system.py
      - name: Run raw-tick replay
        run: |
          mkdir -p halfway_${{ matrix.year }}
          python ph1_backtest/h1_halfway_hedge_system.py --year ${{ matrix.year }} --outdir halfway_${{ matrix.year }} | tee halfway_${{ matrix.year }}/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1-halfway-hedge-${{ matrix.year }}
          path: halfway_${{ matrix.year }}/
          retention-days: 30
