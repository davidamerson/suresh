name: Build Kids Video Android APKs

on:
  push:
    branches:
      - kids-video-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct Android project archive
        shell: bash
        run: |
          cat \
            kids-video-src/project.b64.00 \
            kids-video-src/p3_03 \
            kids-video-src/p3_04 \
            kids-video-src/p3_05 \
            kids-video-src/project.b64.02 \
            kids-video-src/p3_09 \
            kids-video-src/p3_10 \
            kids-video-src/p3_11a \
            kids-video-src/p3_11b1 \
            kids-video-src/p3_11b2 \
            kids-video-src/p3_12 \
            kids-video-src/p3_13 \
            kids-video-src/p3_14 \
            kids-video-src/p3_15 \
            kids-video-src/p3_16 \
            kids-video-src/p3_17 > project.b64
          test "$(wc -c < project.b64)" -eq 51208
          base64 --decode project.b64 > KidsVideoAndroid_Project.zip
          echo "b83d124348c4334f850255bfd7c45b75fffe0aedcfe659952f3ce7538a0349e0  KidsVideoAndroid_Project.zip" | sha256sum --check
          unzip -t KidsVideoAndroid_Project.zip
          unzip -q KidsVideoAndroid_Project.zip

      - name: Build daughter and son APKs
        working-directory: KidsVideoAndroid
        shell: bash
        run: |
          gradle --version
          gradle :app:assembleDaughterDebug :app:assembleSonDebug --stacktrace --no-daemon

      - name: Prepare APK names
        shell: bash
        run: |
          mkdir -p dist
          cp KidsVideoAndroid/app/build/outputs/apk/daughter/debug/app-daughter-debug.apk dist/Daughter-Video.apk
          cp KidsVideoAndroid/app/build/outputs/apk/son/debug/app-son-debug.apk dist/Son-Video.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: Kids-Video-Android-APKs
          path: |
            dist/Daughter-Video.apk
            dist/Son-Video.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
