name: CyberTV isolated free-channel cache audit
on:
  push:
    branches: [cybertv-static-audit-20261107]
    paths: ['.github/workflows/cybertv-local-cache-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Download exact APK as static data
        run: |
          curl -L --fail --silent --show-error --max-time 90 -A 'Mozilla/5.0' 'https://cybertv.fifamatch.online/Cyber%20Tv%20V3_1.apk' -o cybertv.apk
          sha256sum cybertv.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install app and inspect local channel database if present
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          script: |
            adb install -r cybertv.apk
            adb shell monkey -p com.cy.cybertv -c android.intent.category.LAUNCHER 1
            sleep 50
            echo ACTIVE_SCREEN
            adb shell dumpsys activity activities | grep -m1 mResumedActivity || true
            echo ROOT_STATUS
            adb root || true
            adb wait-for-device
            echo DATA_LIST
            adb shell ls -lah /data/user/0/com.cy.cybertv/databases/ || true
            adb shell ls -lah /data/user/0/com.cy.cybertv/files/ || true
            mkdir -p localdata
            adb pull /data/user/0/com.cy.cybertv/databases localdata/ 2>&1 || true
            echo DATABASE_FILES
            find localdata -type f -printf '%P %s bytes\n' | head -50
            python3 cybertv_audit/cache_probe.py
