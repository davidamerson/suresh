name: Continuous single USD1000 Major SR TP90 SL90 2020-2026
on:
  push:
    branches: [major-sr-continuous-1000-dedup-friday-swap-hmr-20261105]
    paths:
      - "ph1_backtest/major_sr_continuous_single_1000.py"
      - ".github/workflows/major-sr-continuous-1000-2020-2026.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuous_replay:
    name: 295m ticks continuous one-account TP90 SL90 
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact replay dependencies
        run: pip install "numpy==2.2.6" "pandas==2.2.3" "numba==0.61.2" "requests==2.32.5" "tzdata==2026.6"
      - name: Parse Python and assert locked strategy and brokerage scenario
        run: |
          python -m py_compile ph1_backtest/major_sr_continuous_single_1000.py
          python -u ph1_backtest/major_sr_continuous_single_1000.py --selftest
      - name: Replay single USD1000 from January 2020 through November 2026
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/continuous_2020_2026
          python -u ph1_backtest/major_sr_continuous_single_1000.py --out results/continuous_2020_2026 2>&1 | tee results/continuous_2020_2026/execution.log
      - name: Upload tick archive SHA256, continuous equity and tickets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MajorSR-Continuous-USD1000-2020-2026
          path: results/continuous_2020_2026/
          retention-days: 30
          if-no-files-found: warn
