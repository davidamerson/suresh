name: Smoke-test both Android TV apps
on:
  push:
    branches: [sltv-two-tv-apps-20261109]
    paths: [".github/workflows/smoke-test-tv-apps.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sltv-two-tv-apps-20261109
      - name: Download compiled APKs from verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tvtest
          gh run download 42604592230 --repo "$GITHUB_REPOSITORY" \
            --name OpenStreamTV-and-SLTV-Companion-debug-APKs --dir tvtest
          ls -lh tvtest/independent/build/outputs/apk/debug/*.apk tvtest/companion/build/outputs/apk/debug/*.apk
      - name: Enable emulator hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APKs and examine channel-menu accessibility
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/smoke_tv_apps.sh
      - name: Upload smoke-test UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenStreamTV-smoke-test-screenshots
          path: |
            tvtest/independent_home.png
            tvtest/companion_home.png
            tvtest/independent_ui.xml
            tvtest/independent_search.png
            tvtest/independent_search_ui.xml
            tvtest/companion_ui.xml
            tvtest/accessibility_service_status.txt
          retention-days: 14
          if-no-files-found: warn
