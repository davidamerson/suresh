name: XAUUSD Major SR only TP or SL, carry weekends, 2020-26
on:
  push:
    branches: [major-sr-tp-sl-only-weekend-hold-20261105]
    paths:
      - "ph1_backtest/major_sr_tp_sl_only_weekend_hold_2020_2026.py"
      - ".github/workflows/major-sr-tp-sl-only-weekend-hold-2020-2026.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    name: Continuous USD1000 12 setups, NO Friday close, TP SL only 
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin exact dependencies
        run: pip install "numpy==2.2.6" "pandas==2.2.3" "numba==0.61.2" "requests==2.32.5" "tzdata==2026.6"
      - name: Assert locked TP SL only rules and Python syntax
        run: |
          python -m py_compile ph1_backtest/major_sr_tp_sl_only_weekend_hold_2020_2026.py
          python -u ph1_backtest/major_sr_tp_sl_only_weekend_hold_2020_2026.py --selftest
      - name: Run full 2020-2026 raw-tick weekend-carry replay
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/continuous_2020_2026
          python -u ph1_backtest/major_sr_tp_sl_only_weekend_hold_2020_2026.py --out results/continuous_2020_2026 2>&1 | tee results/continuous_2020_2026/execution.log
      - name: Save trades, unresolved positions, equity, costs and ZIP SHA-256
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MajorSR-TP-SL-Only-WeekendHold-2020-2026
          path: results/continuous_2020_2026/
          retention-days: 30
          if-no-files-found: warn
