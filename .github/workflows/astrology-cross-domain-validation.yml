name: Astrology Cross-Tradition Empirical Validation 2026
on:
  push:
    branches: [astrology-cross-tradition-validation-20261106]
    paths:
      - 'astrology_quant/study_global_domains.py'
      - '.github/workflows/astrology-cross-domain-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full_global_backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install reproducible scientific stack
        run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'scipy==1.15.3' 'scikit-learn==1.6.1' 'pyswisseph==2.10.3.2' 'requests==2.32.5' 'beautifulsoup4==4.13.4' 'lxml==5.4.0'
      - name: Run cross-domain real public records, strict prior-only rolling training
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/astrology_global_comparison
          python -u astrology_quant/study_global_domains.py 2>&1 | tee results/astrology_global_comparison/full_replay.log
      - name: Archive complete annual predictions, model metrics and data provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astrology-global-cross-domain-pilot-2026
          path: results/astrology_global_comparison/
          retention-days: 90
          if-no-files-found: warn
