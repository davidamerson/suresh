name: Cricket player public source audit
on:
  push:
    branches: [cybertv-static-audit-20261107]
    paths: ['.github/workflows/cricket-source-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public HTML and script references only
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error, re, hashlib
          from html.parser import HTMLParser
          urls=['https://livecricketsl.cc.nf/events/','https://livecricketsl.cc.nf/livecricket/sports.php?id=tencric']
          class P(HTMLParser):
              def __init__(self): super().__init__();self.scripts=[];self.iframes=[];self.links=[]
              def handle_starttag(self,t,attrs):
                  d=dict(attrs)
                  if t=='script' and 'src' in d:self.scripts.append(d['src'])
                  if t=='iframe' and 'src' in d:self.iframes.append(d['src'])
                  if t=='a' and 'href' in d:self.links.append(d['href'])
          for url in urls:
              print('INSPECT_URL',url)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36','Accept':'text/html'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      html=r.read(3000000).decode('utf-8','replace')
                      print('HTTP',r.status,'FINAL_URL',r.geturl(),'HTML_LENGTH',len(html),'SHA256',hashlib.sha256(html.encode()).hexdigest())
                  p=P();p.feed(html)
                  print('SCRIPTS',p.scripts[:70]);print('IFRAMES',p.iframes[:20]);print('LINKS',p.links[:30])
                  for t in ['shaka','dashjs','hls.js','video.js','jwplayer','clappr','widevine','fairplay','clearkey','.m3u8','.mpd']:
                      print('HAS_KEYWORD',t, t.lower() in html.lower())
                  for u in re.findall(r'https?://[^\s\x22\x27<>]{8,220}',html):
                      if not any(v in u.lower() for v in ['license','token=','key=','auth=','secret','password','drm']): print('PUBLIC_PAGE_REFERENCE',u[:180])
              except Exception as e:
                  print('PAGE_FETCH_ERROR',repr(e))
          PY