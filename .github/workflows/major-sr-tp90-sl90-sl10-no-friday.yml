name: Major SR TP90 vs SL90 to SL10, No Friday Close, 2020-26
on:
  push:
    branches: [major-sr-tp90-sl90-to-sl10-sweep-20261105]
    paths:
      - "ph1_backtest/major_sr_tp90_sl90_to_sl10_weekend_hold_2020_2026.py"
      - ".github/workflows/major-sr-tp90-sl90-sl10-no-friday.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full_tick_sweep:
    name: 9 SL levels, $1000 continuous, actual bid ask ticks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned backtest dependencies
        run: pip install "numpy==2.2.6" "pandas==2.2.3" "numba==0.61.2" "requests==2.32.5" "tzdata==2026.6"
      - name: Check unchanged S R H1 entry and nine fixed TP90 SL variants
        run: |
          python -m py_compile ph1_backtest/major_sr_tp90_sl90_to_sl10_weekend_hold_2020_2026.py
          python -u ph1_backtest/major_sr_tp90_sl90_to_sl10_weekend_hold_2020_2026.py --selftest
      - name: Replay 2020 to Nov 2026 Exness raw tick feed, nine independent portfolios
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/continuous_2020_2026
          python -u ph1_backtest/major_sr_tp90_sl90_to_sl10_weekend_hold_2020_2026.py --out results/continuous_2020_2026 2>&1 | tee results/continuous_2020_2026/execution.log
      - name: Retain all tick-source SHA256, tickets, unresolved and annual account states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MajorSR-TP90-SL90-to-SL10-NoFriday-2020-2026
          path: results/continuous_2020_2026/
          retention-days: 30
          if-no-files-found: warn
