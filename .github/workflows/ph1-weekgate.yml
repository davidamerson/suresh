name: PH1 Week Gate Sweep

on:
  push:
    branches: [ph1-actions-backtest]
    paths:
      - 'ph1_backtest/ph1_weekgate_sweep.py'
      - '.github/workflows/ph1-weekgate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  sweep:
    name: WeekGate ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        year: [2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'numba==0.61.2' 'requests==2.32.5'
      - name: Run sweep
        run: |
          mkdir -p weekgate_${{ matrix.year }}
          python ph1_backtest/ph1_weekgate_sweep.py --year ${{ matrix.year }} --outdir weekgate_${{ matrix.year }} | tee weekgate_${{ matrix.year }}/run.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ph1-weekgate-${{ matrix.year }}
          path: weekgate_${{ matrix.year }}/
          if-no-files-found: warn
          retention-days: 30
