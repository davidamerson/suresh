name: Probe Nov 2026 Exness XAUUSD tick archive
on:
  push:
    branches: [nov2026-major-sr-outsample-20261105]
    paths:
      - ".github/workflows/probe-nov2026-xauusd.yml"
      - "ph1_backtest/probe_nov2026_archive.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "requests==2.32.5"
      - run: python -u ph1_backtest/probe_nov2026_archive.py
