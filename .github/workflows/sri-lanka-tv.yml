name: Verify Sri Lankan free TV streams
on:
  push:
    branches: [srilanka-tv-verification-20261108]
    paths:
      - .github/workflows/sri-lanka-tv.yml
      - tv/check_streams.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: srilanka-tv-verification-20261108
          persist-credentials: true
      - name: Check decoder availability
        run: ffmpeg -version | head -n 2
      - name: Test real video frames for each public candidate
        run: python3 -u tv/check_streams.py
      - name: Show results
        run: |
          sed -n '1,150p' tv/report.md
          echo "--- Verified playlist entries ---"
          grep '^#EXTINF' tv/playlist.m3u || true
      - uses: actions/upload-artifact@v4
        with:
          name: sri-lanka-tv-evidence-and-playlist
          path: |
            tv/playlist.m3u
            tv/report.md
            tv/results.json
      - name: Publish playlist and full verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv/playlist.m3u tv/report.md tv/results.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified free Sri Lankan TV streams"
            git push origin HEAD:srilanka-tv-verification-20261108
          fi
