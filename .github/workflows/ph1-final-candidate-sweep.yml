name: PH1 Final Candidate Sweep

on:
  push:
    branches: [ph1-actions-backtest]
    paths:
      - 'ph1_backtest/ph1_final_candidate_sweep.py'
      - '.github/workflows/ph1-final-candidate-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  sweep:
    name: FinalSweep ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        year: [2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: pip install 'numpy==2.2.6' 'pandas==2.2.3' 'numba==0.61.2' 'requests==2.32.5'
      - name: Apply authoritative session convention and exact 2026 cutoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ph1_backtest/ph1_remote_backtest.py')
          s=p.read_text()

          # Keep weekend ticks for continuity, but disallow all new weekend entries.
          old_entry="""                allow = 1\n                fm = friday_mode[c]\n"""
          new_entry="""                allow = 1\n                if dow >= 5:\n                    allow = 0\n                fm = friday_mode[c]\n"""
          if old_entry not in s: raise SystemExit('entry anchor missing')
          s=s.replace(old_entry,new_entry,1)

          # Extended no-Thu/Fri entry gate.
          old_gate="""                elif fm == 3 and (dow == 4 or (dow == 3 and hod >= 12)):\n                    allow = 0\n"""
          new_gate="""                elif fm == 3 and (dow == 4 or (dow == 3 and hod >= 12)):\n                    allow = 0\n                elif fm == 4 and dow >= 3:\n                    allow = 0\n"""
          if old_gate not in s: raise SystemExit('gate anchor missing')
          s=s.replace(old_gate,new_gate,1)

          # Match the user's original 2026 data horizon through Oct 29 exactly.
          old_cut="""                        t = pd.to_datetime(df['Timestamp'], utc=True, errors='coerce')\n                        good = t.notna() & df['Bid'].notna() & df['Ask'].notna()\n"""
          new_cut="""                        t = pd.to_datetime(df['Timestamp'], utc=True, errors='coerce')\n                        good = t.notna() & df['Bid'].notna() & df['Ask'].notna()\n                        if year == 2026 and month == 10:\n                            good = good & (t <= pd.Timestamp('2026-10-29 23:59:59.999999999', tz='UTC'))\n"""
          if old_cut not in s: raise SystemExit('cutoff anchor missing')
          p.write_text(s.replace(old_cut,new_cut,1))
          PY
      - name: Run corrected withdrawal-aware candidate sweep
        run: |
          mkdir -p final_${{ matrix.year }}
          python ph1_backtest/ph1_final_candidate_sweep.py --year ${{ matrix.year }} --outdir final_${{ matrix.year }} | tee final_${{ matrix.year }}/run.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ph1-final-candidates-${{ matrix.year }}
          path: final_${{ matrix.year }}/
          if-no-files-found: warn
          retention-days: 30
