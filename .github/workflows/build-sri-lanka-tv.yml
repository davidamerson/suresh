name: Build Sri Lanka TV Android TV APK
on:
  push:
    branches: [cybertv-tv-app-20261108]
    paths: [".github/workflows/build-sri-lanka-tv.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cybertv-tv-app-20261108
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 35 platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug TV APK
        working-directory: SriLankaTV
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Check APK package, launchers, size and checksum
        run: |
          set -e
          APK=SriLankaTV/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|leanback|application-label|launchable-activity" || true
          sha256sum "$APK"
          du -h "$APK"
          cp "$APK" SriLankaTV/SriLankaTV-AndroidTV-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SriLankaTV-AndroidTV-Debug-APK
          path: SriLankaTV/SriLankaTV-AndroidTV-debug.apk
          if-no-files-found: error
