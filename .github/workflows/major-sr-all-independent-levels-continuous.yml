name: XAUUSD major SR every independently rearmed breakout 2020-26
on:
  push:
    branches: [major-sr-all-independent-repeat-levels-20261105]
    paths:
      - "ph1_backtest/major_sr_every_independent_opportunity_2020_2026.py"
      - ".github/workflows/major-sr-all-independent-levels-continuous.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    name: Continuous USD1000 all independent SR crossings and revalidations
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact dependencies
        run: pip install "numpy==2.2.6" "pandas==2.2.3" "numba==0.61.2" "requests==2.32.5" "tzdata==2026.6"
      - name: Verify source and original locked TP90 SL90 and causal independent rearm
        run: |
          python -m py_compile ph1_backtest/major_sr_every_independent_opportunity_2020_2026.py
          python -u ph1_backtest/major_sr_every_independent_opportunity_2020_2026.py --selftest
      - name: Replay full original raw Exness XAUUSD Bid Ask tick stream, no annual resets
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/continuous_2020_2026
          python -u ph1_backtest/major_sr_every_independent_opportunity_2020_2026.py --out results/continuous_2020_2026 2>&1 | tee results/continuous_2020_2026/execution.log
      - name: Retain raw ticket ledger, repeated level signals, continuous equity and source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MajorSR-AllIndependentRepeated-2020-2026
          path: results/continuous_2020_2026/
          retention-days: 30
          if-no-files-found: warn
