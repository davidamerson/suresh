name: Smoke test both SLTV Android TV APKs
on:
  push:
    branches: [sltv-dual-tv-apps-20261109]
    paths: [".github/workflows/smoke-sltv-dual.yml"]
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Retrieve completed APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sS -fL --max-time 90 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/davidamerson/suresh/actions/artifacts/13672354417/zip" -o /tmp/sltv_two_apks.zip
          unzip -q /tmp/sltv_two_apks.zip -d /tmp/sltvapps
          ls -lh /tmp/sltvapps/*.apk
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and verify Android TV app launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p /tmp/sltv_smoke
            adb install /tmp/sltvapps/SLTV_Independent_AndroidTV.apk
            adb install /tmp/sltvapps/SLTV_Channel_Bridge_AndroidTV.apk
            for entry in "com.suresh.sltv.standalone:independent" "com.suresh.sltv.bridge:bridge"; do
              pkg=$(echo "$entry" | cut -d: -f1)
              kind=$(echo "$entry" | cut -d: -f2)
              adb shell am force-stop "$pkg" || true
              adb shell am start -n "$pkg/com.suresh.srilankatv.MainActivity"
              sleep 10
              adb exec-out screencap -p >"/tmp/sltv_smoke/$kind.png"
              adb shell uiautomator dump /sdcard/windowsmoke.xml >/dev/null
              adb shell cat /sdcard/windowsmoke.xml >"/tmp/sltv_smoke/$kind.xml"
              if [ "$kind" = independent ]; then
                grep -qi "INDEPENDENT" "/tmp/sltv_smoke/$kind.xml"
              else
                grep -qi "SLTV CHANNEL BRIDGE" "/tmp/sltv_smoke/$kind.xml"
              fi
              echo "SMOKE_OK $kind $pkg"
              adb shell input keyevent KEYCODE_BACK
            done
            adb logcat -d | grep "FATAL EXCEPTION" | tail -10 > /tmp/sltv_smoke/fatal-exceptions.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SLTV-Dual-App-Smoke-Test
          path: /tmp/sltv_smoke/
          if-no-files-found: warn
