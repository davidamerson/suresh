name: XAUUSD Reverse H1 SELL 10 to 100 BUY fixed10 seven-year tick replay
on:
  push:
    branches: [h1-reverse-sell10to100-buy10-20261105]
    paths:
      - "ph1_backtest/h1_reverse_asymmetric_sell_10_100_buy_10.py"
      - ".github/workflows/h1-asym-reverse-sell10to100-buy10-sevenyear.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    name: XAUUSD 10 asymmetric variants ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        year: [2020,2021,2022,2023,2024,2025,2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: pip install "numpy==2.2.6" "pandas==2.2.3" "numba==0.61.2" "requests==2.32.5" "tzdata==2026.6"
      - name: Syntax, asymmetric BUY SELL payoff and config tests
        run: |
          python -m py_compile ph1_backtest/h1_reverse_asymmetric_sell_10_100_buy_10.py
          python -u ph1_backtest/h1_reverse_asymmetric_sell_10_100_buy_10.py --selftest
      - name: Download historical Exness Bid Ask and replay every quote
        run: |
          set -o pipefail
          mkdir -p results/${{ matrix.year }}
          python -u ph1_backtest/h1_reverse_asymmetric_sell_10_100_buy_10.py --year ${{ matrix.year }} --out results/${{ matrix.year }} 2>&1 | tee results/${{ matrix.year }}/execution.log
      - name: Upload each variant summary and individual trade audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H1-Asym-Sell10to100-Buy10-${{ matrix.year }}
          path: results/${{ matrix.year }}/
          retention-days: 30
          if-no-files-found: warn
