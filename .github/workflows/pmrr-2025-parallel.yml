name: PMRR-D 2025 Blind Parallel

on:
  push:
    branches: [pmrr-2025-blind]
    paths:
      - '.github/workflows/pmrr-2025-parallel.yml'

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -O3 -std=c++20 pmrr_remote/pmrr_backtest.cpp -o pmrr_remote/pmrr_backtest
      - name: Calibrate October 2026
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2 'https://ticks.ex2archive.com/ticks/XAUUSD_Raw_Spread/2026/10/Exness_XAUUSD_Raw_Spread_2026_10.zip' -o /tmp/cal.zip
          unzip -p /tmp/cal.zip | ./pmrr_remote/pmrr_backtest > /tmp/cal.csv
          python3 pmrr_remote/summarize.py --calibrate /tmp/cal.csv

  month:
    needs: calibrate
    strategy:
      fail-fast: false
      matrix:
        m: ['01','02','03','04','05','06','07','08','09','10','11','12']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -O3 -std=c++20 pmrr_remote/pmrr_backtest.cpp -o pmrr_remote/pmrr_backtest
      - name: Backtest 2025-${{ matrix.m }}
        run: |
          set -euo pipefail
          M='${{ matrix.m }}'
          URL="https://ticks.ex2archive.com/ticks/XAUUSD_Raw_Spread/2025/${M}/Exness_XAUUSD_Raw_Spread_2025_${M}.zip"
          curl -L --fail --retry 5 --retry-delay 2 "$URL" -o /tmp/xau.zip
          unzip -t /tmp/xau.zip
          mkdir -p out
          unzip -p /tmp/xau.zip | ./pmrr_remote/pmrr_backtest > "out/2025_${M}.csv"
          echo "=== MONTH ${M} RESULT ==="
          cat "out/2025_${M}.csv"
          tail -n +2 "out/2025_${M}.csv" | awk -F, '{n++; if($3>0)p++; if($2==1)t++; sum+=$3; if(n==1||$3<w)w=$3; if(n==1||$5<dd)dd=$5; if($4>r)r=$4} END {printf("MONTH_SUMMARY month=%s days=%d positive=%d targets=%d pnl=%.6f worst_close=%.6f worst_intraday=%.6f max_rev=%d\n",ENVIRON["M"],n,p,t,sum,w,dd,r)}'
      - uses: actions/upload-artifact@v4
        with:
          name: pmrr-2025-${{ matrix.m }}
          path: out/2025_${{ matrix.m }}.csv
          retention-days: 7

  aggregate:
    needs: month
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pmrr-2025-*
          path: results/2025
          merge-multiple: true
      - name: Aggregate
        run: |
          mkdir -p results/final
          ls -lh results/2025
          python3 pmrr_remote/summarize.py --pattern 'results/2025/*.csv' --outdir results/final
          cat results/final/PMRR_D_2025_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: PMRR-D-2025-PARALLEL-FINAL
          path: results/final/
          retention-days: 7
