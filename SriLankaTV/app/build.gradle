plugins {
    id 'com.android.application'
}
android {
    namespace 'com.suresh.srilankatv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.suresh.srilankatv'
        minSdk 23
        targetSdk 32
        versionCode 1
        versionName '0.1.0'
    }
    buildFeatures { buildConfig true }
    flavorDimensions "mode"
    productFlavors {
        standalone {
            dimension "mode"
            applicationId "com.suresh.sltv.standalone"
            resValue "string", "app_name", "Sri Lanka TV Independent"
        }
        phone {
            dimension "mode"
            applicationId "com.suresh.sltv.phone"
            resValue "string", "app_name", "Sri Lanka TV Phone"
        }
        sltvbridge {
            dimension "mode"
            applicationId "com.suresh.sltv.bridge"
            resValue "string", "app_name", "SLTV Channel Bridge"
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
