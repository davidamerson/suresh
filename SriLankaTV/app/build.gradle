plugins { id 'com.android.application' }
android {
    namespace 'com.suresh.srilankatv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.suresh.tv'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '1.0.0'
        resValue 'string', 'app_name', 'TV'
        resValue 'string', 'prime_shortcut_description', 'Optional Prime remote button shortcut. It only observes the Prime key press to open TV.'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
